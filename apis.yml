x-coverage:
  state: covered
  reason: covered
  detail: 'One institution-operated machine-readable API was found, verified live and documented: the
    Servicio de Publicaciones OAI-PMH 2.0 interface at revistas.unav.edu (OJS 3.4.0.8, 100 sets, four
    metadata formats, unauthenticated). Two further institution-owned surfaces were confirmed through
    third parties: the university''s own SAML IdP in RedIRIS SIR2 and eduGAIN (entityID https://www.rediris.es/sir/unavidp,
    scope unav.es, Sirtfi declared) and Crossref membership 6226 with DOI prefix 10.15581. Everything
    else that looks like an API here is a tenancy on someone else''s platform: DADUN CNAMEs to visum.studio,
    Unika to Ex Libris Primo, the research portal to Dialnet CRIS at Universidad de La Rioja, and BiblioGuias
    to Springshare — all four recorded as relationships, none of their contracts saved. Two surfaces resisted
    probing: dadun.unav.edu returns 403 to every automated client behind an Anubis-style bot wall, and
    the OJS REST API returns 403 without a per-user token. No central developer portal, open-data platform,
    registrar/timetable API, or verifiable institutional GitHub organization exists. www.unav.edu serves
    a soft-404 (HTTP 200 redirect to /error-404) for /llms.txt and /.well-known/security.txt, so neither
    was credited; its robots.txt does carry a real Content-Signal declaration (ai-train=no, search=yes,
    ai-input=yes).'
