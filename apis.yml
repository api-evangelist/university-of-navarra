aid: university-of-navarra
name: University of Navarra
x-type: university
x-category: Private Research University
description: 'The University of Navarra (Universidad de Navarra) is a private research university founded
  in 1952, headquartered in Pamplona, Spain, with campuses in San Sebastian, Madrid and Barcelona. Its
  programmable footprint is small, and most of it is bought rather than built: the library discovery layer
  is an Ex Libris Primo VE tenancy, the DADUN institutional repository runs on a hosted DSpace whose host
  CNAMEs to a third-party platform, the research portal is a Dialnet CRIS tenancy operated by Fundacion
  Dialnet, and the library guides are Springshare LibGuides. Three surfaces are genuinely the institution''s
  own. The Servicio de Publicaciones operates a self-hosted Open Journal Systems instance at revistas.unav.edu
  with a live, unauthenticated OAI-PMH 2.0 harvesting interface across 100 sets — the only institution-operated
  machine-readable API confirmed here. The university runs its own SAML Identity Provider, published through
  the RedIRIS SIR2 federation and interfederated into eduGAIN since 2018 with REFEDS Sirtfi declared.
  And it is a Crossref member with its own DOI prefix, 10.15581, covering more than 33,000 registered
  DOIs. There is no central developer portal, no open-data platform, no documented registrar, timetable
  or campus API, and no verifiable institutional GitHub organization.'
