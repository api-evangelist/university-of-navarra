- aid: university-of-navarra:dadun-oai-pmh
  name: DADUN Institutional Repository (OAI-PMH)
  x-operator: tenant
  x-operator-basis: dadun.unav.edu CNAMEs to dadun.visum.studio, and dadun.unav.es CNAMEs to dadun-es.visum.studio
    — a third-party hosting platform, not the university's own infrastructure. The hostname is on the
    institution's registrable domain, which is exactly the case a host-based rule over-credits; the CNAME
    is the basis for reading it as a tenancy.
  description: DADUN (Deposito Academico Digital de la Universidad de Navarra) is the university's open-access
    institutional repository, running DSpace and exposing a standard OAI-PMH 2.0 interface for harvesting
    Dublin Core metadata across academic deposits, doctoral theses, teaching materials, institutional
    publications, ancient collections and university journals. The content, the collections and the DOIs
    are the university's; the deployment is hosted on a third-party platform. The whole host sits behind
    an Anubis-style bot-protection layer that returned HTTP 403 to every probe on 2026-09-01, including
    with a desktop browser User-Agent, so the endpoint could not be independently confirmed — it is registered
    publicly in ROAR, Hispana and REBIUN.
  humanURL: https://www.unav.edu/web/biblioteca/apoyo-investigador/acceso-abierto-dadun
